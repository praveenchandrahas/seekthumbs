site_name: seekthumbs
site_description: Netflix-style previews on the mpv seek bar (trickplay / seek thumbnails), for a film library on a read-only rclone mount.
repo_url: https://github.com/praveenchandrahas/seekthumbs
repo_name: praveenchandrahas/seekthumbs
docs_dir: docs
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle: {icon: material/brightness-4, name: Switch to light mode}
  features: [navigation.instant, navigation.sections, navigation.top, toc.integrate, content.code.copy]
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Install: install.md
  - Usage: usage.md
